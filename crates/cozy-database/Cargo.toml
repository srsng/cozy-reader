[package]
name = "cozy-database"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sea-orm = { version = "1.1.1", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
] }
sea-orm-migration = { version = "1.1.19", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
] }
ts-rs = "10.1.0"
chrono = { version = "0.4.42", features = ["serde"] }
async-trait = "0.1"
thiserror = { workspace = true }
tauri-plugin-sql = { version = "^2.0.0", default-features = false }

[build-dependencies]
cozy-database-codegen = { path = "../cozy-database-codegen" }

[dev-dependencies]
tokio = { version = "1.47.1", features = ["full"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ts-rs = "10.1.0"
tempfile = { workspace = true }
