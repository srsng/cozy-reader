[workspace]
members = ["crates/cozy-*"]
resolver = "2"

[workspace.dependencies]
bstr = "1.12.1"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.18"
tokio = { version = "1.52.3", default-features = false }
anyhow = "1.0.100"
parking_lot = "0.12.5"
futures = "0.3.32"
toml = "0.9.5"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tempfile = "3.21"
rand = "0.10.1"
notify-rust = "4.11.7"
async-trait = "0.1"

glob = "0.3.3"
regex = "1.12.2"

ts-rs = "10.1.0"

[profile.release]
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true        # Enables link to optimizations
opt-level = "s"   # Optimize for binary size
debug = true      # Enable debug symbols, for profiling

[profile.bench]
codegen-units = 256
lto = false
opt-level = 3

[profile.dev]
incremental = false

[profile.test]
incremental = false
